name: Combined ReTone checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retone
          POSTGRES_PASSWORD: retone_test
          POSTGRES_DB: retone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retone -d retone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://retone:retone_test@127.0.0.1:5432/retone_test
      RETONE_INSECURE_COOKIES: "true"
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo test --locked
      - run: node --check public/app.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Android trusted-origin and invite policies
        run: |
          javac -d "$RUNNER_TEMP/retone-policy" apps/android/AppPolicy.java tests/AndroidPolicyTests.java
          java -cp "$RUNNER_TEMP/retone-policy" com.retone.app.AndroidPolicyTests
      - name: Check installable apps and download integrity
        run: |
          node --check public/app-install.js
          node --check public/install-page.js
          node --check public/sw.js
          node --check public/photo-upload.js
          node --check public/app-notifications.js
          node --check public/app-push.js
          node tests/firebase-setup.cjs
          node --test tests/push-worker.cjs
          node --check public/friend-link.js
          node --check apps/android/assets/native-notifications.js
          node --test tests/installable-apps.cjs
      - name: Check combined frontend behavior
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/retone-frontend" jsdom@22.1.0 jsqr@1.4.0
          NODE_PATH="$RUNNER_TEMP/retone-frontend/node_modules" node tests/frontend-regressions.cjs
          NODE_PATH="$RUNNER_TEMP/retone-frontend/node_modules" node tests/invite-flows.cjs
          NODE_PATH="$RUNNER_TEMP/retone-frontend/node_modules" node tests/photos-notifications.cjs
          NODE_PATH="$RUNNER_TEMP/retone-frontend/node_modules" node tests/push-client.cjs
      - name: Check server against existing database schema
        run: |
          git show 251243e00effd021db33bc403b0ca14702dd52c5:migrations/0001_retone_v2.sql > "$RUNNER_TEMP/previous-schema.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/previous-schema.sql"
          cargo build --locked
          ./target/debug/retone-v2 > "$RUNNER_TEMP/retone-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4000/api/health > /dev/null; then break; fi
            sleep 1
          done
          if ! NODE_PATH="$RUNNER_TEMP/retone-frontend/node_modules" node tests/deployment-smoke.cjs; then
            cat "$RUNNER_TEMP/retone-server.log"
            exit 1
          fi


