name: Build Android push app
on:
  push:
    paths: ['apps/android/**', 'apps/android-gradle/**', 'public/firebase-client.json', '.github/workflows/android-push.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and shrink Firebase messaging app
        working-directory: apps/android-gradle
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Retone-Android-unsigned
          path: apps/android-gradle/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
